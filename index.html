<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINTV Player Embed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100vh; width: 100vw; overflow: hidden; }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
<iframe id="playerFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>

<script>
    // ── Build the full player HTML as a string ──────────────────────────────
    // We inject it via srcdoc so it is NOT subject to X-Frame-Options /
    // Content-Security-Policy frame-ancestors headers on the stream server.
    // URL params (mora=, key=, key2=) are forwarded transparently.

    const forwardedSearch = window.location.search; // pass-through to inner player

    const playerHTML = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINTV MPD LINKS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"><\\/script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        .shaka-video-container { position: absolute; inset: 0; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; background: #000; object-fit: contain; }
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; visibility: hidden !important; opacity: 0 !important; }
        .shaka-controls-button, .shaka-overflow-button-label, .shaka-current-time, .shaka-time-container { color: #fff !important; }
        #buf-dot {
            position: absolute; top: 12px; right: 14px;
            width: 8px; height: 8px; border-radius: 50%;
            background: #1e90ff; opacity: 0; z-index: 2000;
            transition: opacity 0.2s; box-shadow: 0 0 6px #1e90ff;
        }
        #buf-dot.active { opacity: 1; animation: pulse-dot 0.8s ease-in-out infinite; }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="shaka-video-container" data-shaka-player>
        <video autoplay muted playsinline preload="auto"></video>
    </div>
    <div id="buf-dot"></div>

    <script>
        // ── Receive params forwarded from the outer page ──────────────────
        // The outer wrapper posts them via postMessage (see below),
        // but we also parse srcdoc-injected search string as fallback.
        const _fwdSearch = ${JSON.stringify(forwardedSearch)};

        document.addEventListener('DOMContentLoaded', async () => {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) { console.error('Browser not supported'); return; }

            const video = document.querySelector('video');
            const container = document.querySelector('.shaka-video-container');
            const bufDot = document.getElementById('buf-dot');

            const player = new shaka.Player();
            await player.attach(video);

            const ui = new shaka.ui.Overlay(player, container, video);
            ui.configure({
                controlPanelElements: ['play_pause','mute','volume','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
                volumeBarColors: { base: 'rgba(135,206,235,0.35)', level: 'rgb(255,255,255)' },
                seekBarColors: { base: 'rgba(50,55,61)', buffered: 'rgba(135,206,235,0.6)', played: 'rgb(255,255,255)' }
            });

            // ── Parse forwarded URL params ───────────────────────────────
            const params = new URLSearchParams(_fwdSearch);

            let streamUrl = "https://mag03.tvx.prd.tv.odido.nl/wh7f454c46tw75168188_-627298088/PLTV/86/224/3221241590/3221241590.mpd?zoneoffset=0&devkbps=1-7000&servicetype=1&icpid=86&accounttype=1&limitflux=-1&limitdur=-1&tenantId=3103&accountinfo=%7E%7EV2.0%7EqbcsJh_jU5C9BcZc959e_wae44b4867b3417aa76b5db2da20fe46c%7EKZzTWjB8qD1zdgbJjRPVLJX-tV0qiN9RBHC_iseGrsmTSRjj06oGDtGlpSCRGOwF3626cf085c08d024c7e4aafc18c32440%7EExtInfo5Ro3VppWiUusj2ippqUPkQ%3D%3D4a2d2c8ce133f43026d0e31b822b8474%3A20240601012829%3AUTC%2C10001003329222%2C87.212.140.171%2C20240601012829%2C3103_SP1S%2C10001003329222%2C-1%2C0%2C1%2C%2C%2C2%2C3103_Sport1%2C%2C%2C2%2C10000044444303%2C0%2C10000025050255%2CNDEzODg2NTY3MzEwMzI2NzMwNjMwNTY%3D%2C%2C%2C5%2C1%2CEND&GuardEncType=2&RTS=1717205309&from=11&hms_devid=1008&online=1717205309&mag_hms=1008,311,305&_=1717205322621";

            if (_fwdSearch.includes("mora=")) {
                const start = _fwdSearch.indexOf("mora=") + 5;
                const end = _fwdSearch.indexOf("&key=") !== -1 ? _fwdSearch.indexOf("&key=") : _fwdSearch.length;
                streamUrl = decodeURIComponent(_fwdSearch.substring(start, end));
            }

            const kId = params.get("key");
            const kVal = params.get("key2");
            const drmConfig = {
                clearKeys: (kId && kVal)
                    ? { [kId]: kVal }
                    : { "ef34ae91b4f2415e8439b2ad105e7488": "243248d8de1ff8c7c587ee2057317523" }
            };

            player.configure({
                drm: drmConfig,
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 5_000_000,
                    switchInterval: 8,
                    bandwidthUpgradeTarget: 0.85,
                    bandwidthDowngradeTarget: 0.95,
                    restrictions: { minBandwidth: 500_000, maxBandwidth: Infinity }
                },
                streaming: {
                    bufferingGoal: 30,
                    rebufferingGoal: 4,
                    bufferBehind: 30,
                    lowLatencyMode: false,
                    safeSeekOffset: 3,
                    stallEnabled: true,
                    stallThreshold: 1,
                    stallSkip: 0.1,
                    segmentPrefetchLimit: 4,
                    retryParameters: { timeout: 15_000, maxAttempts: 6, baseDelay: 200, backoffFactor: 1.5, fuzzFactor: 0.5 },
                    segmentRequestTimeout: 10_000,
                    inaccurateManifestTolerance: 2,
                    useNativeHlsOnSafari: true
                },
                manifest: {
                    retryParameters: { timeout: 10_000, maxAttempts: 4, baseDelay: 300, backoffFactor: 1.5 },
                    dash: { clockSyncUri: '' }
                }
            });

            let reconnectTimer = null;
            let reconnectAttempts = 0;
            const MAX_RECONNECTS = 8;

            player.addEventListener('error', async (event) => {
                const err = event.detail;
                console.warn('Shaka error:', err.code, err.message);
                const recoverable = [1001,1002,1003,2000,2001,2002,3014,3016];
                if (recoverable.includes(err.code) || (err.code >= 1000 && err.code < 4000)) scheduleReconnect();
            });

            function scheduleReconnect() {
                if (reconnectTimer || reconnectAttempts >= MAX_RECONNECTS) return;
                reconnectAttempts++;
                const delay = Math.min(1000 * reconnectAttempts, 8000);
                reconnectTimer = setTimeout(async () => {
                    reconnectTimer = null;
                    try {
                        const currentTime = video.currentTime;
                        await player.load(streamUrl);
                        if (!player.isLive() && currentTime > 0) video.currentTime = currentTime;
                        reconnectAttempts = 0;
                        video.muted = true;
                        video.play().catch(() => {});
                    } catch (e) { console.error('Reconnect failed:', e); scheduleReconnect(); }
                }, delay);
            }

            let lastTime = 0, stallCount = 0;
            setInterval(() => {
                if (!video.paused && !video.ended && video.readyState >= 3) {
                    if (video.currentTime === lastTime) {
                        stallCount++;
                        bufDot.classList.add('active');
                        if (stallCount >= 3) { video.currentTime += 0.2; stallCount = 0; }
                    } else { stallCount = 0; bufDot.classList.remove('active'); }
                    lastTime = video.currentTime;
                } else { bufDot.classList.remove('active'); stallCount = 0; }
            }, 1000);

            try {
                await player.load(streamUrl);
                video.muted = true;
                video.play().catch(e => console.warn('Autoplay blocked:', e));
            } catch (error) { console.error('Initial load error:', error); scheduleReconnect(); }

            document.addEventListener('click', () => {
                if (video.muted) { video.muted = false; video.volume = 1; }
            }, { once: true });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    player.configure('streaming.segmentPrefetchLimit', 1);
                } else {
                    player.configure('streaming.segmentPrefetchLimit', 4);
                    if (player.isLive()) {
                        const seekRange = player.seekRange();
                        video.currentTime = seekRange.end - 3;
                    }
                }
            });

            if ('connection' in navigator) {
                const conn = navigator.connection;
                const applyConnProfile = () => {
                    const mbps = conn.downlink || 5;
                    player.configure('abr.defaultBandwidthEstimate', mbps * 1_000_000 * 0.8);
                    if (mbps < 2) { player.configure('streaming.bufferingGoal', 15); player.configure('streaming.rebufferingGoal', 3); }
                    else { player.configure('streaming.bufferingGoal', 30); player.configure('streaming.rebufferingGoal', 4); }
                };
                applyConnProfile();
                conn.addEventListener('change', applyConnProfile);
            }

            // ── Listen for postMessage updates (e.g. dynamic channel switch) ──
            window.addEventListener('message', async (e) => {
                if (!e.data || e.data.type !== 'BINTV_LOAD') return;
                const { url, keyId, keyVal } = e.data;
                if (!url) return;
                if (keyId && keyVal) player.configure('drm.clearKeys', { [keyId]: keyVal });
                try { await player.load(url); video.muted = true; video.play().catch(() => {}); }
                catch(err) { console.error('postMessage load failed:', err); }
            });
        });
    <\\/script>
</body>
</html>`;

    // ── Inject via srcdoc ────────────────────────────────────────────────────
    // srcdoc bypasses X-Frame-Options because the content originates from
    // the parent document, not an external server.
    document.getElementById('playerFrame').srcdoc = playerHTML;
</script>
</body>
</html>
