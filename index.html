<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Fast Media Player</title>

    <!-- JW Player 8 -->
    <script src="https://content.jwplatform.com/libraries/KB5zFt7A.js"></script>

    <!-- Shaka Player (best for low-latency DASH/MPD) -->
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.10.5/dist/shaka-player.compiled.min.js"></script>

    <!-- P2P Media Loader (WebTorrent-based, works with Shaka too) -->
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-core@latest/build/p2p-media-loader-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-shaka@latest/build/p2p-media-loader-shaka.min.js"></script>

    <!-- Optional: HLS.js + P2P fallback for .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13"></script>
    <script src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@latest/build/p2p-media-loader-hlsjs.min.js"></script>

    <style>
        body, html { margin:0; padding:0; background:#000; overflow:hidden; }
        #player { width:100vw; height:100vh; }
    </style>
</head>
<body>

<div id="player"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const mora = new URLSearchParams(window.location.search).get('mora');
        const title = decodeURIComponent(new URLSearchParams(window.location.search).get('title') || 'Stream');
        const img = decodeURIComponent(new URLSearchParams(window.location.search).get('img') || '');

        if (!mora) {
            document.getElementById('player').innerHTML = '<p style="color:white;text-align:center;margin-top:50px;">No stream URL provided</p>';
            return;
        }

        jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";

        const playerInstance = jwplayer("player").setup({
            width: "100%",
            height: "100%",
            autostart: true,
            muted: false,
            stretching: "uniform",
            image: img || undefined,
            title: title,

            // === ULTRA-FAST DASH (MPD) USING SHAKA + P2P ===
            file: mora,
            type: mora.endsWith(".mpd") ? "dash" : (mora.endsWith(".m3u8") ? "hls" : "mp4"),

            // Shaka Player config for lowest possible latency on DASH
            shakaConfig: mora.endsWith(".mpd") ? {
                abr: { enabled: true },
                streaming: {
                    lowLatencyMode: true,
                    inaccurateManifestTolerance: 0,
                    rebufferingGoal: 0.01,        // almost instant rebuffering
                    bufferingGoal: 3,             // start playing after 3s buffer
                    bufferBehind: 15,
                    useNativeHlsOnSafari: false,
                    failureRetryParameters: {
                        maxAttempts: 10,
                        baseDelay: 100,
                        backoffFactor: 1.5,
                        fuzzFactor: 0.5
                    }
                },
                // P2P acceleration for DASH (WebTorrent-based CDN bypass)
                p2p: {
                    enabled: true,
                    core: {
                        swarmId: mora,               // unique per stream
                        maxPeerConnections: 100
                    }
                }
            } : undefined,

            // HLS.js + P2P (fallback for .m3u8)
            hlsjsConfig: mora.endsWith(".m3u8") ? {
                debug: false,
                startLevel: -1,                  // auto quality
                capLevelToPlayerSize: true,
                maxBufferLength: 10,
                maxMaxBufferLength: 20,
                p2pConfig: {
                    live: true,
                    segments: { maxAge: 86400 }
                }
            } : undefined,

            skin: { name: "netflix" }
        });

        // Optional: force lowest latency mode on live DASH
        playerInstance.on('ready', () => {
            if (mora.includes('.mpd')) {
                const shaka = playerInstance.getProvider().shaka;
                if (shaka) {
                    shaka.configure({
                        streaming: {
                            lowLatencyMode: true,
                            rebufferingGoal: 0.1,
                            bufferingGoal: 2
                        }
                    });
                }
            }
        });
    });
</script>
</body>
</html>
