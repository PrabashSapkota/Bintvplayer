<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>

    <!-- JW Player -->
    <script src="https://content.jwplatform.com/libraries/KB5zFt7A.js"></script>
    
    <!-- jQuery (kept for compatibility) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

    <!-- Day.js -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>

    <!-- Custom CSS + Netflix Skin -->
    <link href="https://res.cloudinary.com/do1zdkwaj/raw/upload/v1704087632/SUB/neflex_uoodhg.css" rel="stylesheet">

    <style>
        body { background: #000; overflow: hidden; margin: 0; padding: 0; }
        #playerContainer, #player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
        /* Your existing custom styles remain unchanged */
        .clossalert, .share_channell, .share-channel, .custom-btn, button.GetCode, button.Reload { /* ... your styles ... */ }
        /* Netflix skin styles (you already have them) */
    </style>
</head>
<body>
    <div id="playerContainer">
        <div id="player">Loading the player...</div>
    </div>

    <div class="share_channell">
        <div class="share-channel">
            <div class="share-channel_title">Copy for your site</div>
            <textarea id="player_share" onclick="this.select();" onfocus="this.select();"></textarea>
            <button class="custom-btn" onclick="document.querySelector('#player_share').select();document.execCommand('copy');">Click to copy</button>
        </div>
    </div>

    <script>
        // JW Player License Key
        jwplayer.key = 'XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo';

        document.addEventListener("DOMContentLoaded", function () {
            const mora = getParameterByName('mora');
            const embed = getParameterByName('embed');
            const getIMG = decodeURIComponent(getParameterByName('img') || '');
            const title = decodeURIComponent(getParameterByName('title') || '');
            const getKEY = getParameterByName('key');   // keyId
            const getKEY2 = getParameterByName('key2'); // key

            if (mora) {
                if (mora === "#") {
                    alert('Return to the previous page');
                    return;
                }

                const playerInstance = jwplayer("player");

                let sources = [];
                let drmConfig = null;

                if (mora.endsWith(".m3u8")) {
                    sources.push({ type: "hls", file: mora, label: "Auto", default: true });
                } else if (mora.endsWith(".mp4")) {
                    sources.push({ type: "mp4", file: mora, label: "MP4", default: true });
                } else if (mora.endsWith(".mpd")) {
                    sources.push({ type: "dash", file: mora, label: "DASH", default: true });

                    // ClearKey DRM for MPD — placed inside playlist item for reliability
                    if (getKEY && getKEY2) {
                        drmConfig = {
                            clearkey: {
                                keyId: getKEY,
                                key: getKEY2
                            }
                        };
                    }
                }

                const playerSetup = {
                    playlist: [{
                        title: title,
                        description: "Bintv.fun | Sports Player",
                        image: getIMG,
                        sources: sources,
                        drm: drmConfig   // DRM attached to the item
                    }],
                    width: "100%",
                    height: "100%",
                    aspectratio: "16:9",
                    autostart: true,
                    preload: "metadata",           // Important for faster start
                    playbackRateControls: true,
                    cast: {},
                    logo: { file: "", link: "", position: "top-right" },
                    skin: { name: "netflix" },
                    advertising: {
                        client: "vast",
                        schedule: [{ offset: "pre", tag: "sdsd" }]
                    }
                };

                playerInstance.setup(playerSetup);

                // === Analytics & Tracking (unchanged) ===
                function trackJWPlayerEvent(eventCategory, eventAction, eventLabel, eventValue) {
                    gtag('event', eventAction, {
                        'event_category': eventCategory,
                        'event_label': eventLabel,
                        'value': eventValue
                    });
                }

                let viewDuration = 0;
                let viewStart = 0;
                let isPlaying = false;

                playerInstance.on('play', function () {
                    if (!isPlaying) {
                        viewStart = Date.now();
                        isPlaying = true;
                    }
                    trackJWPlayerEvent('Video', 'Play', title);
                });

                playerInstance.on('pause', function () {
                    if (isPlaying) {
                        viewDuration += (Date.now() - viewStart);
                        isPlaying = false;
                    }
                    trackJWPlayerEvent('Video', 'Pause', title, Math.round(viewDuration / 1000));
                });

                playerInstance.on('complete', function () {
                    if (isPlaying) {
                        viewDuration += (Date.now() - viewStart);
                        isPlaying = false;
                    }
                    trackJWPlayerEvent('Video', 'Complete', title, Math.round(viewDuration / 1000));
                });

                playerInstance.on('buffer', () => trackJWPlayerEvent('Video', 'Buffering', title));
                playerInstance.on('seek', (e) => trackJWPlayerEvent('Video', 'Seek', `From ${e.position} to ${e.offset}`));
                playerInstance.on('error', (e) => trackJWPlayerEvent('Video', 'Error', e.message));

                window.addEventListener('beforeunload', function () {
                    if (isPlaying) viewDuration += (Date.now() - viewStart);
                    trackJWPlayerEvent('Video', 'Unload', title, Math.round(viewDuration / 1000));
                });

            } else if (embed) {
                document.getElementById('playerContainer').innerHTML = 
                    `<iframe src="${embed}" sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" allow="encrypted-media" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen autoplay></iframe>`;
            } else {
                document.getElementById('playerContainer').innerHTML = '<p>No media or embed URL provided.</p>';
            }
        });

        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // Google Analytics (kept)
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-VKQHQ602MX');
    </script>
</body>
</html>
