            height: 100vh;

            width: 100%;

            background-size: contain !important;
            background-repeat: no-repeat !important;
            width: 80px !important;
            height: 80px !important;
            border: none !important;
            animation: none !important;
            background-color: transparent !important;
        }

        .art-state-loading .art-loading::after {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top-color: var(--netflix-red);
            animation: art-loading-spin 1s linear infinite;
            box-sizing: border-box;
        }

        @keyframes art-loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Controls Customization */
        .art-control-play, .art-control-volume, .art-control-fullscreen, .art-control-pip {
            color: #fff !important;
        }

        .art-control-play:hover, .art-control-volume:hover, .art-control-fullscreen:hover {
            color: var(--netflix-red) !important;
        }

        .art-progress-played {
            background-color: var(--netflix-red) !important;
        }

        .art-progress-indicator {
            background-color: var(--netflix-red) !important;
        }

        .art-video-control {
            background-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent) !important;
        }

        /* Header Title (Netflix Style) */
        #player-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .art-state-hover #player-header {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="player-header"></div>
    <div id="player-container" class="artplayer-app"></div>
    <div id="embed-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const mora = params.get('mora');
            const embed = params.get('embed');
            const getKEY = params.get('key');
            const getKEY2 = params.get('key2');
            const title = params.get('title') || 'Netflix Player';
            const poster = params.get('img');

            if (title) {
                document.getElementById('player-header').innerText = decodeURIComponent(title);
            }

            if (embed) {
                document.getElementById('player-container').style.display = 'none';
                const embedContainer = document.getElementById('embed-container');
                embedContainer.style.display = 'block';
                embedContainer.innerHTML = `<iframe src="${embed}" allow="encrypted-media" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen autoplay></iframe>`;
                return;
            }

            if (!mora) {
                document.getElementById('player-container').innerHTML = '<div style="color:white; display:flex; justify-content:center; align-items:center; height:100vh;">No stream provided.</div>';
                return;
            }

            // Initialize ArtPlayer
            const art = new Artplayer({
                container: '.artplayer-app',
                url: mora,
                poster: poster,
                title: title,
                volume: 0.7,
                isLive: true,
                muted: false,
                autoplay: true,
                autoSize: true,
                autoMini: true,
                playbackRate: true,
                aspectRatio: true,
                fullscreen: true,
                fullscreenWeb: true,
                miniProgressBar: true,
                setting: true,
                pip: true,
                theme: '#E50914',
                icons: {
                    loading: '<div class="art-loading"></div>',
                },
                customType: {
                    m3u8: function (video, url) {
                        if (Hls.isSupported()) {
                            const hls = new Hls();
                            hls.loadSource(url);
                            hls.attachMedia(video);
                        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                            video.src = url;
                        }
                    },
                    mpd: function (video, url) {
                        const player = new shaka.Player(video);
                        
                        // Handle ClearKey DRM
                        if (getKEY && getKEY2) {
                            player.configure({
                                drm: {
                                    clearKeys: {
                                        [getKEY]: getKEY2
                                    }
                                }
                            });
                        }

                        player.load(url).catch(error => {
                            console.error('Shaka Player error', error);
                        });
                    }
                },
            });

            // Auto-detect type if not provided correctly by extension
            if (mora.includes('.mpd')) {
                art.type = 'mpd';
            } else if (mora.includes('.m3u8')) {
                art.type = 'm3u8';
            }

            // Error Handling
            art.on('error', (error) => {
                console.error('ArtPlayer Error:', error);
            });
        });
    </script>
</body>

</html>
